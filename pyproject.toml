[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-electrolyte-trajectory"
version = "0.1.0"
description = "Reproducible AIMD/MD trajectory preprocessing and small forecasting baselines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
io = ["ase>=3.23,<4"]
transformer = ["torch>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
